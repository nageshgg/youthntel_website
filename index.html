<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouthIntel</title>
<meta name="description" content="YouthIntel — Before the crisis. Not after. Safeguarding intelligence for children's mental health. Website coming soon." />
<meta name="theme-color" content="#0a1f38" />

<!-- Social share preview -->
<meta property="og:title" content="YouthIntel" />
<meta property="og:description" content="Before the crisis. Not after. Website coming soon." />
<meta property="og:type" content="website" />
<meta property="og:image" content="logo.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="favicon.png" />

<style>
  :root {
    --bg-top: #071426;
    --bg-bottom: #0b2440;
    --text-soft: #b9c7d6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: 6vh 5vw;
    background: radial-gradient(circle at 50% 35%, var(--bg-bottom), var(--bg-top) 75%);
    color: var(--text-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }

  .brand {
    max-width: 720px;
    width: 100%;
    height: auto;
    display: block;
  }

  /* Fallback shown only if the brand image fails to load */
  .fallback { display: none; }
  .fallback h1 {
    font-size: clamp(2.5rem, 9vw, 4.5rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .fallback h1 span { font-weight: 400; font-style: italic; color: #3fa9dd; }
  .fallback p {
    margin-top: 0.6rem;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-style: italic;
    color: #8fa2b5;
  }

  .notice {
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7c8ea0;
  }

  .notice::after {
    content: "";
    display: block;
    width: 46px;
    height: 2px;
    margin: 1rem auto 0;
    background: linear-gradient(90deg, #1f8fbf, #4bc7b0);
    border-radius: 2px;
  }
</style>
</head>
<body>

  <img
    class="brand"
    src="logo.png"
    alt="YouthIntel — Before the crisis. Not after."
    onerror="this.style.display='none';document.querySelector('.fallback').style.display='block';"
  />

  <div class="fallback">
    <h1>Youth<span>Intel</span></h1>
    <p>Before the crisis. Not after.</p>
  </div>

  <p class="notice">Website coming soon</p>

</body>
</html>
